# Origem única do monólito modular (00-arquitetura §4.4, §5) — TEMPLATE do nginx-unprivileged.
# A imagem renderiza este arquivo com envsubst em /etc/nginx/conf.d/default.conf no start.
# Copie para <INFRA_DIR>/nginx.conf. Roda como não-root, na 8080 (porta interna da imagem).
#
# Variável de ambiente exigida no serviço `front` (compose):
#   APP_UPSTREAM_PORT   porta do backend (= ROOT_API_PORT do .env). Sem valor padrão: o
#                       compose a declara com `:?`, e o envsubst só toca nomes com prefixo APP_
#                       (NGINX_ENVSUBST_FILTER) — nenhum $variavel do nginx é reescrito.
#
# Marcadores a preencher: <MAX_BODY_SIZE> (maior upload declarado nos config/ dos módulos, por
# exemplo 5m — sem isto vale 1m e o PROXY devolve 413 antes de a API ver o arquivo) e
# <PROXY_READ_TIMEOUT> (maior operação síncrona legítima da API, por exemplo 65s).
#
# POR MÓDULO: um bloco `location` por `module.json:webPath` não-nulo (ver "BLOCO POR MÓDULO"
# abaixo e references/front-origem-unica.md). NÃO existe catch-all em `/`: rota que nenhum
# módulo declarou responde 404, de propósito.

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Pasta própria e vazia (front.Dockerfile): a da imagem base traz a página padrão do nginx.
    root /srv/site;

    # Cabeçalhos de segurança. `add_header` num bloco interno SUBSTITUI os do externo — por
    # isso os blocos de módulo abaixo não usam add_header (cache vai por `expires`).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP de partida para SPA same-origin sem script/estilo de terceiros — ajuste ao projeto.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    # DNS interno do Docker + variável no proxy_pass: o nginx resolve `app` a cada uso. Sem isso
    # ele resolve UMA vez no boot — crasha se `app` ainda não existe, e segue falando com o IP
    # morto depois de um redeploy que recria só o backend.
    resolver 127.0.0.11 valid=10s;

    # Sonda do HEALTHCHECK da imagem: responde sem tocar o backend.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Sem catch-all em `/`: a raiz responde 404 de propósito. Sem esta linha, `/` cairia no índice do
    # diretório do site (vazio) e devolveria 403, não 404 — medido. Um módulo com webPath "/" a
    # substitui pela própria `location /`.
    location = / {
        return 404;
    }

    # A API: todos os módulos, um processo, uma porta.
    location /api/v1/ {
        client_max_body_size <MAX_BODY_SIZE>;
        set $app_upstream app:${APP_UPSTREAM_PORT};
        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout <PROXY_READ_TIMEOUT>;
    }

    # ── BLOCO POR MÓDULO — repita para cada module.json com webPath não-nulo ──────────────
    # <WEB_PATH> é o campo `webPath` do manifesto (por exemplo /catalogo). O build do front
    # coloca o dist do módulo em /srv/site<WEB_PATH>/, então `root` + $uri basta
    # (nada de alias, que quebra o try_files).
    #
    # location /<WEB_PATH>/ {
    #     try_files $uri $uri/ /<WEB_PATH>/index.html;   # fallback de SPA, só dentro do módulo
    #     expires -1;                                    # a entrada HTML nunca é cacheada
    # }
    # location ~* ^/<WEB_PATH>/assets/.+\.(js|css|woff2?|png|jpe?g|webp|svg|ico)$ {
    #     expires 1y;                                    # arquivo com hash no nome
    #     access_log off;
    # }
}
