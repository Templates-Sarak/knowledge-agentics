# Compose LOCAL do monólito modular — dois usos do mesmo arquivo (references/compose-local.md):
#
#   docker compose --env-file .env --env-file <INFRA_DIR>/.env up --wait
#       dependências de dev (só o Postgres); a app roda no host
#   docker compose --env-file .env --env-file <INFRA_DIR>/.env --profile app up --build --wait
#       paridade: constrói e sobe app + front em loopback
#
# SEMPRE os dois --env-file (Docker Compose 2.23+; o segundo vence em conflito). Sem eles o compose
# só leria o .env da raiz e as DEPLOY_* faltariam. O `docker-up.mjs` já passa os dois.
#
# Copie para a raiz do projeto como `compose.yml`. Marcadores a preencher:
#   <INFRA_DIR>  pasta do deploy (por exemplo `deploy`): guarda o .env das chaves DEPLOY_*
#   <PROJECT>   prefixo do projeto, minúsculas — nome do projeto compose e das imagens locais
#   <MODULE>_DB_URL   uma linha por módulo que usa o adapter postgres (ver o serviço `app`)
#
# Toda variável de infraestrutura é EXIGIDA com `:?` — nunca um valor padrão embutido. Duas fontes:
#   .env da raiz        ROOT_API_PORT e os <MODULE>_* (o `sync-env` é dono dele)
#   <INFRA_DIR>/.env    as chaves DEPLOY_*, que SÓ este compose lê (modelo: <INFRA_DIR>/.env.example).
#                       Ficam fora do .env da raiz porque o `sync-env` moveria para ORFAS as chaves
#                       que nenhum manifesto exige (references/compose-local.md).
# O `env_file` do serviço `app` aponta só para o .env da raiz: o ambiente do processo não carrega DEPLOY_*.

name: <project>-local

services:
  # Dependência de dev. Sem `profiles`: sobe nos dois usos.
  db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${DEPLOY_DB_NAME:?defina DEPLOY_DB_NAME no <INFRA_DIR>/.env}
      POSTGRES_USER: ${DEPLOY_DB_USER:?defina DEPLOY_DB_USER no <INFRA_DIR>/.env}
      POSTGRES_PASSWORD: ${DEPLOY_DB_PASSWORD:?defina DEPLOY_DB_PASSWORD no <INFRA_DIR>/.env}
    # Publicada SÓ em loopback: o adapter postgres e o `npm run migrations` rodam no host.
    # Não precisa do host? Remova `ports` — o serviço `app` fala com `db` pela rede do compose.
    ports:
      - "127.0.0.1:${DEPLOY_DB_PORT:?defina DEPLOY_DB_PORT no <INFRA_DIR>/.env}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Paridade com produção: o MESMO Dockerfile do backend.
  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        <PROJECT>_VERSION: ${<PROJECT>_VERSION:-}
    image: <project>-app:local
    # O .env único da raiz entra como ambiente do PROCESSO (precedência máxima, ADR-004). O
    # artefato não leva o .env do módulo, então o ponteiro ENV_ROOT nunca é resolvido aqui.
    env_file:
      - .env
    environment:
      # Dentro do container o banco é o serviço `db`, não 127.0.0.1. Uma linha por módulo.
      # Senha com caractere especial precisa de percent-encoding na URL.
      <MODULE>_DB_URL: postgres://${DEPLOY_DB_USER:?}:${DEPLOY_DB_PASSWORD:?}@db:5432/${DEPLOY_DB_NAME:?}
    depends_on:
      db:
        condition: service_healthy
    # Sem `ports`: o único ponto de entrada é o front, que fala com `app` pela rede do compose.

  # A origem única: front estático + proxy de /api/v1/ para `app`.
  front:
    profiles: ["app"]
    build:
      context: .
      dockerfile: front.Dockerfile
      args:
        <PROJECT>_VERSION: ${<PROJECT>_VERSION:-}
    image: <project>-front:local
    environment:
      APP_UPSTREAM_PORT: ${ROOT_API_PORT:?defina ROOT_API_PORT no .env}
      NGINX_ENVSUBST_FILTER: ^APP_
    ports:
      - "127.0.0.1:${DEPLOY_FRONT_PORT:?defina DEPLOY_FRONT_PORT no <INFRA_DIR>/.env}:8080"
    depends_on:
      app:
        condition: service_healthy

volumes:
  db-data:
