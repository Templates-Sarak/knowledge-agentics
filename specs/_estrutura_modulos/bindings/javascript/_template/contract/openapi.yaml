openapi: 3.1.0

# A FONTE do contrato do modulo <module>. O codigo segue esta spec, nunca o inverso.
# Lei dona: specs/arquitetura/02-contrato-e-dados.md
info:
  title: <Module> — contrato publico
  version: 1.0.0
  description: >
    Unica superficie publica do modulo <module>. O front dele, o conector e qualquer
    outro modulo obtem dado por aqui — nunca pelo banco, nunca por import.

servers:
  - url: /api/v1/<module>

paths:
  /health:
    get:
      summary: Vivo e com as portas resolvidas
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  module: { type: string }

  /meta:
    get:
      summary: Metadados PUBLICOS do modulo, por allowlist — nunca o manifesto inteiro
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  version: { type: string }
                  role: { type: string }
                  basePath: { type: string }
                  webPath: { type: [string, 'null'] }
                  navigation: { type: [object, 'null'] }
                  exportsSummary: { type: boolean }

  /summary:
    get:
      summary: Contagem e indicadores agregados pelo conector
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }

  /entries:
    get:
      summary: Lista registros
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: colecao paginada
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Entry' }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
    post:
      summary: Cria um registro
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewEntry' }
      responses:
        '201':
          description: criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entry' }
        '400':
          description: VALIDATION
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /entries/{hash}:
    get:
      summary: Obtem um registro pelo identificador universal
      parameters:
        - { name: hash, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entry' }
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

components:
  schemas:
    Entry:
      type: object
      required: [hash, title, status]
      properties:
        hash: { type: string }
        title: { type: string }
        status: { type: string, enum: [draft, active, closed] }
        createdAt: { type: string, format: date-time }

    NewEntry:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        status: { type: string, enum: [draft, active, closed] }

    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - VALIDATION
                - UNAUTHENTICATED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - LIMIT_EXCEEDED
                - EXTERNAL_DEPENDENCY
                - INTERNAL
            message: { type: string }
            requestId: { type: string }
