[project]
name = "<escopo>"
version = "0.1.0"
description = "Federacao de modulos autossuficientes."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.7",
  "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# `packages/` e a excecao minima (interface e contrato); `adapters/` sao as implementacoes;
# `src/` e a fiacao. Nenhum dos tres e modulo de negocio — modulo mora em `modulos/`.
packages = ["packages", "adapters", "src"]

[tool.pytest.ini_options]
# A raiz entra no sys.path para que `packages`, `adapters` e `src` sejam importaveis sem instalar.
pythonpath = ["."]
asyncio_mode = "auto"

# NAO ha `testpaths` apontando para `modulos/` de proposito: cada modulo e testado a partir da
# PASTA DELE (`python verificar.py` faz isso), e e justamente isso que prova que ele roda isolado
# — a condicao pratica de "pronto para extracao" (specs/arquitetura/03-operacao.md §6).

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

# A raiz e a base de pacotes: sem isto o mypy resolve `packages/portas/__init__.py` com DOIS
# nomes ("portas" e "packages.portas") e aborta antes de checar qualquer coisa.
mypy_path = "."
explicit_package_bases = true
namespace_packages = true

# Cada modulo tem tipos proprios e e checado a partir da PASTA DELE, com as dependencias dele.
# Checar daqui misturaria os sys.path de todos os modulos — o oposto do isolamento.
exclude = ["^modulos/"]

# A config do ruff mora em `.ruff.toml`, GERADA de `ferramentas/gate/limiares.mjs`, e NAO aqui.
#
# O motivo e de precedencia, nao de gosto: o ruff escolhe UM arquivo de configuracao, e o
# `.ruff.toml` vence o `pyproject.toml` por inteiro — nao ha merge. Manter uma secao `[tool.ruff]`
# aqui a deixaria silenciosamente morta, que e pior que duplicar: duas fontes, e a que o autor
# edita nao e a que vale. Os limiares 40/3/4 sao LEI (specs/arquitetura/04-regras.md §4.7) e por
# isso sao derivados, nunca escritos a mao — era este arquivo que os repetia antes.
