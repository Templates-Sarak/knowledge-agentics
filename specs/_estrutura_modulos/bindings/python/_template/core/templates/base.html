<!doctype html>
<!--
  Template base do artefato publicavel do modulo <modulo>.
  UNICO lugar de template do modulo (doutrina/01-modulo.md §2).
  Marcadores no formato {{chave}} sao preenchidos por core/motor.
  Artefato publicado e IMUTAVEL: nao se altera, reformata nem regera (doutrina/02 §7).
-->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>{{titulo}}</title>
  </head>
  <body>
    <main>
      <h1>{{titulo}}</h1>
      <dl>
        <dt>Identificador</dt>
        <dd>{{hash}}</dd>
        <dt>Situacao</dt>
        <dd>{{status}}</dd>
        <dt>Criado em</dt>
        <dd>{{criadoEm}}</dd>
      </dl>
    </main>
  </body>
</html>
