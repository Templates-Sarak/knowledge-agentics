[project]
name = "<escopo>-<modulo>"
version = "0.1.0"
description = "Modulo <modulo> — fatia vertical autossuficiente (contrato + core + api)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.7",
  "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "api"]

[tool.pytest.ini_options]
# A raiz do modulo entra no sys.path: `core`, `api` e `tests` sao importaveis sem instalar.
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

# NAO ha `[tool.ruff]` aqui, e a ausencia e DELIBERADA — ela e o que mantem a cobranca LIGADA.
#
# O ruff sobe a arvore procurando configuracao e IGNORA `pyproject.toml` que nao declare
# `[tool.ruff]`. Sem a secao, quem governa os arquivos deste modulo e o `.ruff.toml` da raiz,
# GERADO de `tools/gate/thresholds.mjs` — a mesma fonte unica que o gate usa, e a razao de o
# numero 40 nao estar escrito em lugar nenhum deste arquivo.
#
# COM a secao, ela sombrearia a da raiz e os limiares voltariam ao DEFAULT do ruff (max-args 5,
# max-statements 50). Declarar aqui DESLIGA o limiar em vez de liga-lo — o contrario do que a
# intuicao diz, e o motivo de este comentario existir no lugar da secao.
#
# LIMITE CONHECIDO — o modulo EXTRAIDO. Ao virar repositorio proprio, ele sai sem o `.ruff.toml`
# da raiz e fica sem limiar cobrado pelo LINTER ate ser religado a um esqueleto de projeto
# (`tools/create-project.mjs`), que o traz de volta gerado da mesma fonte. A janela e estreita
# e o piso nao cai nela: o gate viaja DENTRO do modulo e cobra os mesmos 40/3/4 por
# `limiar-funcao`, `limiar-aninhamento` e `limiar-parametros`. Perde-se a verificacao PROFUNDA do
# linter (complexidade, idiomas), nunca o piso. Fechar a janela com uma secao aqui seria pior:
# compraria cobertura para o transitorio desligando-a no caso normal. Quem a fecha de vez e a
# config POR MODULO gerada de cada `modulo.json`.

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
