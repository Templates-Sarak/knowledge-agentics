[project]
name = "<escopo>-<modulo>"
version = "0.1.0"
description = "Modulo <modulo> — fatia vertical autossuficiente (contrato + core + api)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.7",
  "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "api"]

[tool.pytest.ini_options]
# A raiz do modulo entra no sys.path: `core`, `api` e `tests` sao importaveis sem instalar.
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
# Limiares de specs/arquitetura/04-regras.md §4.7. O gate cobre a arquitetura ENTRE arquivos;
# o linter cobre a qualidade DENTRO do arquivo.
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C90", "T20", "ANN", "RET", "SIM", "PL"]
ignore = ["ANN401"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 4
max-statements = 40

[tool.ruff.lint.per-file-ignores]
# Teste pode usar assert, nao precisa de anotacao completa e nao tem limite de tamanho.
"tests/**" = ["ANN", "PLR2004", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
